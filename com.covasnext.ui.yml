app-id: com.covasnext.ui
runtime: org.freedesktop.Platform
runtime-version: 24.08
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: 24.08
command: covas-next-ui-wrapper
finish-args:
  # X11 + XShm access (forced, no Wayland)
  - --socket=x11
  - --share=ipc
  # Network access
  - --share=network
  # Audio access
  - --socket=pulseaudio
  # File access
  - --filesystem=home:rw
  - --filesystem=/tmp:rw
  - --filesystem=xdg-run/electron-vr:create
  # Devices access
  - --device=dri # OpenGL
  #- --device=input # Not supported in flatpak-builder 1.4 (default on ubuntu 24.04) 
  - --device=all # Fallback for input devices
  # D-Bus access for notifications and system integration
  - --socket=session-bus
  - --socket=system-bus
  # Environment variables for better compatibility
  - --env=RUST_BACKTRACE=1
  - --env=SSL_CERT_DIR=/etc/ssl/certs
  - --env=ELECTRON_OZONE_PLATFORM_HINT=x11
  - --env=OZONE_PLATFORM=x11
  - --env=GDK_BACKEND=x11
  #- --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 # This is a fix for Nvidia+Wayland rendering, but it breaks the transparent overlay window – we are forcing X11 in flatpak so we might get away without it

modules:
  - name: covas-next-ui
    buildsystem: simple
    sources:
      - type: dir
        path: dist/linux-unpacked
      - type: file
        path: ui/src/assets/EDAI_logo_transparent_512.png
        dest-filename: EDAI_logo_transparent_512.png
    build-commands:
      # Create directories
      - mkdir -p /app/bin
      - mkdir -p /app/lib/covas-next-ui
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      
      # Install the application
      - cp -r * /app/bin/
      
      # Make sure executables are executable
      - chmod +x /app/bin/covas-next
      - chmod +x /app/bin/resources/Chat/Chat
      
      # Create wrapper script to ensure X11 environment
      - |
        cat > /app/bin/covas-next-ui-wrapper << 'EOF'
        #!/bin/bash
        set -e
        unset WAYLAND_DISPLAY
        export ELECTRON_OZONE_PLATFORM_HINT="${ELECTRON_OZONE_PLATFORM_HINT:-x11}"
        export OZONE_PLATFORM="${OZONE_PLATFORM:-x11}"
        export GDK_BACKEND="${GDK_BACKEND:-x11}"

        # The host OpenXR loader cannot discover layers in Flatpak's private XDG_DATA_HOME.
        host_layer_dir="$HOME/.local/share/openxr/1/api_layers/implicit.d"
        sandbox_layer_dir="$XDG_DATA_HOME/openxr/1/api_layers/implicit.d"
        mkdir -p "$host_layer_dir" "$(dirname "$sandbox_layer_dir")"
        if [ -d "$sandbox_layer_dir" ] && [ ! -L "$sandbox_layer_dir" ]; then
          for asset in electron_vr_openxr_layer.json electron_vr_openxr_layer.json.disabled libelectron_vr_openxr_layer.so; do
            if [ -f "$sandbox_layer_dir/$asset" ] && [ ! -e "$host_layer_dir/$asset" ]; then
              cp -p "$sandbox_layer_dir/$asset" "$host_layer_dir/$asset"
            fi
          done
          mv "$sandbox_layer_dir" "$sandbox_layer_dir.flatpak-backup"
        fi
        if [ ! -e "$sandbox_layer_dir" ]; then
          ln -s "$host_layer_dir" "$sandbox_layer_dir"
        fi

        exec zypak-wrapper /app/bin/covas-next --ozone-platform=x11 "$@"
        EOF
      - chmod +x /app/bin/covas-next-ui-wrapper
      
      # Install icon
      - install -Dm644 EDAI_logo_transparent_512.png /app/share/icons/hicolor/128x128/apps/com.covasnext.ui.png
      - install -Dm644 EDAI_logo_transparent_512.png /app/share/icons/hicolor/256x256/apps/com.covasnext.ui.png
      
      # Create desktop file
      - |
        cat > /app/share/applications/com.covasnext.ui.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=COVAS:NEXT
        Comment=Elite Dangerous AI Integration
        Exec=covas-next-ui-wrapper
        Icon=com.covasnext.ui
        Categories=Game;Utility;
        StartupNotify=true
        EOF
